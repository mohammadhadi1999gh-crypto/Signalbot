<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>داشبورد Exhaustion Short</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f4f5f7;--mut:#6b7280;--g:#16a34a;--r:#dc2626;--y:#d97706;--b:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#0e1117;--fg:#e6edf3;--card:#1a2029;--mut:#8b949e}}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:Tahoma,system-ui,sans-serif;font-size:14px}
h1{font-size:18px;margin:4px 0 4px}
.sub{color:var(--mut);font-size:12px;margin-bottom:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}
.tabs button{border:0;background:var(--card);color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--b);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0 12px}
.c{background:var(--card);border-radius:10px;padding:10px}
.c small{color:var(--mut);display:block}.c b{font-size:18px}
.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}
svg{width:100%;height:120px;background:var(--card);border-radius:10px;margin-bottom:12px}
.box{overflow-x:auto;margin-bottom:14px}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--card);white-space:nowrap}
th{color:var(--mut);font-weight:normal}
h2{font-size:15px;margin:14px 0 6px}
</style>
</head>
<body>
<h1>داشبورد Exhaustion Short</h1>
<div class="sub" id="upd">در حال بارگذاری…</div>
<div class="tabs" id="src"></div>
<div class="tabs" id="tabs"></div>
<div class="grid" id="stats"></div>
<svg id="eq" viewBox="0 0 300 120" preserveAspectRatio="none"></svg>
<h2 id="symh">گزارش هر ارز</h2>
<div class="box"><table><thead><tr><th>ارز</th><th>تعداد</th><th>وین‌ریت</th><th>میانگین R</th><th>برایند</th><th>PF</th></tr></thead><tbody id="sym"></tbody></table></div>
<h2>معاملات</h2>
<div class="box"><table><thead><tr><th>زمان</th><th>ارز</th><th>ورود</th><th>SL</th><th>TP1</th><th>TP2</th><th>خروج</th><th>وضعیت</th><th>R</th><th>سود</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
const SRC=["بک‌تست","زنده"];
const P=[["همه",-1],["امروز",0],["۷ روز",7],["۳۰ روز",30]];
let bt=null,live=null,src=0,per=0;
const $=id=>document.getElementById(id);
const fmt=(x,d=2)=>(x>0?"+":"")+x.toFixed(d)+"٪";
const REASON={tp:"TP",sl:"SL",be:"سر به سر پس از TP1",invalid:"ابطال (کلوز بالای اوج)",timeout:"تایم‌اوت",open:"باز",lost_data:"داده ناقص"};
function cur(){return src===1?live:bt}
function cutoff(d){if(d<0)return 0;if(d===0){const t=new Date();t.setHours(0,0,0,0);return t.getTime()}return Date.now()-d*86400000}
function trades(){const c=cutoff(P[per][1]);return ((cur()||{}).trades||[]).filter(t=>(t.entry_time||0)>=c)}
function render(){
  const c=cur(); if(!c){return}
  const T=trades().sort((a,b)=>a.entry_time-b.entry_time);
  const C=T.filter(t=>t.pnl!=null);
  const n=C.length,w=C.filter(t=>t.pnl>0).length,l=n-w;
  const tot=C.reduce((a,t)=>a+t.pnl,0)*100;
  const avgR=n?C.reduce((a,t)=>a+(t.R||0),0)/n:0;
  const gw=C.filter(t=>t.pnl>0).reduce((a,t)=>a+t.pnl,0),gl=-C.filter(t=>t.pnl<=0).reduce((a,t)=>a+t.pnl,0);
  const pf=gl>0?(gw/gl).toFixed(2):"—";
  let cum=0,peak=0,mdd=0;const pts=[0];
  C.forEach(t=>{cum+=t.pnl*100;pts.push(cum);peak=Math.max(peak,cum);mdd=Math.min(mdd,cum-peak)});
  const wr=n?w/n*100:0;
  $("stats").innerHTML=[
    ["وین‌ریت",wr.toFixed(0)+"٪",wr>=50?"g":"r"],
    ["برایند",fmt(tot),tot>=0?"g":"r"],
    ["بسته‌شده",n+` (${w} برد / ${l} باخت)`,""],
    ["میانگین R",avgR.toFixed(2),avgR>=0?"g":"r"],
    ["Profit Factor",pf,""],
    ["باز الان",T.filter(t=>t.pnl==null).length,"y"]
  ].map(x=>`<div class="c"><small>${x[0]}</small><b class="${x[2]}">${x[1]}</b></div>`).join("");
  const mn=Math.min(...pts),mx=Math.max(...pts),rg=(mx-mn)||1;
  $("eq").innerHTML=pts.length>1?`<polyline fill="none" stroke="#2563eb" stroke-width="2" vector-effect="non-scaling-stroke" points="${pts.map((v,i)=>`${i/(pts.length-1)*300},${110-(v-mn)/rg*100}`).join(" ")}"/>`:"";
  const by={};C.forEach(t=>{(by[t.sym]=by[t.sym]||[]).push(t)});
  $("sym").innerHTML=Object.entries(by).map(([s,a])=>{
    const ww=a.filter(t=>t.pnl>0).length,sum=a.reduce((x,t)=>x+t.pnl,0)*100,ar=a.reduce((x,t)=>x+(t.R||0),0)/a.length;
    const g1=a.filter(t=>t.pnl>0).reduce((x,t)=>x+t.pnl,0),g2=-a.filter(t=>t.pnl<=0).reduce((x,t)=>x+t.pnl,0);
    return `<tr><td>${s.replace("-USDT-SWAP","")}</td><td>${a.length}</td><td>${(ww/a.length*100).toFixed(0)}٪</td><td class="${ar>=0?"g":"r"}">${ar.toFixed(2)}</td><td class="${sum>=0?"g":"r"}">${fmt(sum)}</td><td>${g2>0?(g1/g2).toFixed(2):"—"}</td></tr>`}).join("");
  $("rows").innerHTML=T.slice().reverse().slice(0,300).map(t=>{
    const d=new Date(t.entry_time).toLocaleString("fa-IR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
    const open=t.pnl==null, col=open?"y":(t.pnl>0?"g":"r");
    const pct=open?"—":fmt(t.pnl*100);
    return `<tr><td>${d}</td><td>${t.sym.replace("-USDT-SWAP","")}</td><td>${(+t.entry).toPrecision(6)}</td><td>${(+t.sl).toPrecision(6)}</td><td>${(+t.tp1).toPrecision(6)}</td><td>${(+t.tp2).toPrecision(6)}</td><td>${t.exit?(+t.exit).toPrecision(6):"—"}</td><td>${REASON[t.reason]||t.reason}</td><td class="${col}">${t.R!=null?t.R.toFixed(2):"—"}</td><td class="${col}">${pct}</td></tr>`}).join("");
}
function drawTabs(){
  $("src").innerHTML=SRC.map((s,i)=>`<button data-s="${i}">${s}</button>`).join("");
  $("src").onclick=e=>{const i=e.target.dataset.s;if(i!=null){src=+i;markAll();render()}};
  $("tabs").innerHTML=P.map((p,i)=>`<button data-i="${i}">${p[0]}</button>`).join("");
  $("tabs").onclick=e=>{const i=e.target.dataset.i;if(i!=null){per=+i;markAll();render()}};
}
function markAll(){
  [...$("src").children].forEach((b,i)=>b.classList.toggle("on",i===src));
  [...$("tabs").children].forEach((b,i)=>b.classList.toggle("on",i===per));
  $("symh").textContent=src===1?"سیگنال‌های زنده — هر ارز":"گزارش هر ارز (بک‌تست)";
}
drawTabs();markAll();
function load(){
  const ts="?t="+Date.now();
  Promise.allSettled([fetch("exhaustion.json"+ts).then(r=>r.json()),fetch("live.json"+ts).then(r=>r.json())]).then(([a,b])=>{
    if(a.status==="fulfilled"&&a.value&&a.value.trades)bt=a.value;
    if(b.status==="fulfilled"&&b.value&&b.value.trades)live=b.value;
    const d=src===1?live:bt;
    $("upd").textContent=(d&&d.updated?"آخرین بروزرسانی: "+new Date(d.updated).toLocaleString("fa-IR"):"در انتظار داده")+(bt&&bt.days?" | بک‌تست: "+bt.days+" روز / "+bt.symbols+" ارز":"");
    render();
  });
}
load(); setInterval(load,60000);
</script>
</body>
</html>
