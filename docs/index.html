<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>داشبورد</title><style>body{font-family:Tahoma,sans-serif;margin:12px;font-size:14px}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #ddd;text-align:right}.g{color:#16a34a}.r{color:#dc2626}</style></head><body><h2>داشبورد سیگنال‌ها</h2><div id="s"></div><table><thead><tr><th>نماد</th><th>TF</th><th>ورود</th><th>وضعیت</th><th>نتیجه</th></tr></thead><tbody id="r"></tbody></table><p id="u"></p><script>fetch('data.json?t='+Date.now()).then(x=>x.json()).then(d=>{const a=d.signals||[];const c=a.filter(s=>['win','loss','be'].includes(s.result));const w=c.filter(s=>s.result==='win').length;const tot=c.reduce((x,s)=>x+(s.final_pct||0),0);document.getElementById('s').innerHTML='ربات: '+(d.enabled?'<b class=g>روشن</b>':'<b>خاموش</b>')+' | وین‌ریت: '+(c.length?Math.round(w/c.length*100):0)+'٪ | برایند: '+tot.toFixed(1)+'٪ | بسته: '+c.length;document.getElementById('r').innerHTML=a.slice().reverse().slice(0,200).map(s=>'<tr><td>'+String(s.symbol||'').replace('USDT','')+'</td><td>'+(s.tf||'')+'</td><td>'+(+s.entry||0).toPrecision(6)+'</td><td>'+(s.status||'')+'</td><td class="'+((s.final_pct||0)>=0?'g':'r')+'">'+(s.final_pct!=null?s.final_pct.toFixed(1)+'٪':'—')+'</td></tr>').join('');document.getElementById('u').textContent='آخرین به‌روزرسانی: '+new Date(d.generated_at*1000).toLocaleString('fa-IR')}).catch(()=>{document.getElementById('s').textContent='داده‌ای پیدا نشد'})</script></body></html>
