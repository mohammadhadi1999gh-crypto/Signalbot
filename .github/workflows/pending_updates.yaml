name: pending-updates

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: pending updates
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/getUpdates?timeout=0&limit=100" -o updates.json
          head -c 4000 updates.json; echo
