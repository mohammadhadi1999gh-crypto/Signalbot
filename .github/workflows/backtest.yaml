name: backtest

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: run backtest
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXCHANGE: okx
          AUTO_UNIVERSE: "1"
          UNIVERSE_SIZE: "150"
          WORKERS: "6"
          BT_MAX_SYMBOLS: "60"
          FVG_TFS: "15m,30m,1h,2h,4h,6h,12h,1d"
        run: python backtest_fvg.py
      - name: upload results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: backtest_results.json
