name: diagnose

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: telegram check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "== webhook before =="
          curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/getWebhookInfo"; echo
          echo "== delete webhook (bot uses polling) =="
          curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/deleteWebhook"; echo
          echo "== send test message =="
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" -d "text=تست از GitHub Actions"; echo
