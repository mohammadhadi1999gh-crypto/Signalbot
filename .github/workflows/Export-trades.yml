name: export-trades

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: restore bot state
        uses: actions/cache/restore@v4
        with:
          path: |
            positions.json
            trades_log.json
            outcomes.jsonl
            features.jsonl
            settings.json
          key: botstate-none
          restore-keys: botstate-
      - name: pack
        run: |
          mkdir -p export
          for f in positions.json trades_log.json outcomes.jsonl features.jsonl settings.json; do
            [ -f "$f" ] && cp "$f" export/
          done
          ls -la export
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: trades
          path: export
          retention-days: 7
