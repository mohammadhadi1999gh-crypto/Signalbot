name: signals

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes (GitHub may delay runs)
  workflow_dispatch:
    inputs:
      mode:
        description: "once = scan | check = test connection"
        default: "check"

concurrency:
  group: signals
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            stats.json
          key: botstate-${{ github.run_id }}
          restore-keys: botstate-

      - name: run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_BACK: "1"
          MAX_AGE_MIN: "25"
          SENSITIVITY: ultra      # conservative | balanced | aggressive | ultra
          TRENDLINES: "1"
          FVG_TL_STRATEGY: "0"   # only Pump-Fade Grid signals are sent
          SPIKE_HUNTER: "0"
          HUNTER_LIMITS: "0"
          WORKERS: "10"
          EXCHANGE: okx          # okx | binance | kcex
          AUTO_UNIVERSE: "1"      # scan top KCEX gainers automatically instead of a fixed list
          UNIVERSE_SIZE: "150"   # raise further to scan more of the market; more calls = slower + more rate-limit risk
          GRID_STRATEGY: "1"      # Pump-Fade Grid (reverse-engineered fixed-ratio short)
          REAL_LEVERAGE: "5"      # your real account leverage, for the liquidation warning line
        run: python bot.py ${{ github.event.inputs.mode || 'once' }}

      - name: save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state.json
            stats.json
          key: botstate-${{ github.run_id }}
