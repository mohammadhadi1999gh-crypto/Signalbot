name: signals

on:
  schedule:
    - cron: "*/5 * * * *"      # GitHub may delay scheduled runs
  workflow_dispatch: {}

concurrency:
  group: signals
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            positions.json
            trades_log.json
            features.jsonl
            outcomes.jsonl
            outcomes_done.json
            settings.json
            learned.json
            tg_offset.json
          key: botstate-${{ github.run_id }}
          restore-keys: botstate-
      - name: run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STRAT_MODE: fvg
          FVG_TFS: "15m,30m,1h,2h,4h,6h,12h,1d"
          FVG_MIN_VOL_USDT: "5000000"
          EXCHANGE: okx
          AUTO_UNIVERSE: "1"
          UNIVERSE_SIZE: "150"
          WORKERS: "6"
          SCAN_BACK: "1"
          MAX_AGE_MIN: "25"
        run: python run_gh.py
      - name: save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state.json
            positions.json
            trades_log.json
            features.jsonl
            outcomes.jsonl
            outcomes_done.json
            settings.json
            learned.json
            tg_offset.json
          key: botstate-${{ github.run_id }}
      - name: upload dashboard
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
